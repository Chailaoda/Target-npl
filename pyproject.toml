[project]
name = "target-npl"
version = "0.1.0"
description = "Local, evidence-linked filtering of public sample topic content"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[tool.uv]
package = false

# Static gate only. The runtime stays standard-library-only; ruff is an
# optional developer tool (`uvx ruff check`). Rules are limited to syntax and
# undefined-name errors so the gate is meaningful instead of a style debt list.
[tool.ruff]
line-length = 160
target-version = "py312"
exclude = [".venv", "vendor", "third_party", "tmp", "node_modules", "control-web"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
